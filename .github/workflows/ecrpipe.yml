name: Build, Scan, and Push to ECR

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: self-hosted
    env:
      aws_region: eu-north-1

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.aws_region }}

      # 3️⃣ Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 5️⃣ Scan image with Trivy (vulnerability scan)
      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/ecr_dotnet_repo:latest
          format: table
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: CRITICAL,HIGH

      # 6️⃣ Push image to ECR (only if scan passes)
      - name: Push Docker image to ECR
        if: success()
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ecr_dotnet_repo
          IMAGE_TAG: Trivyscannedimage
        run: |
          echo "Pushing Docker image to ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "✅ Push complete!"

      # 7️⃣ Display final image URL
      - name: Display Image URL
        run: echo "✅ Image pushed to: ${{ steps.login-ecr.outputs.registry }}/ecr_dotnet_repo:latest"
