name: Scan ECR Image with Trivy (Table Report)

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  scan:
    runs-on: self-hosted
    env:
      aws_region: eu-north-1
      ECR_REPOSITORY: ecr_dotnet_repo
      IMAGE_TAG: latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.aws_region }}

      # 3️⃣ Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4️⃣ Run Trivy vulnerability scan (table output)
      - name: Run Trivy vulnerability scan (table output)
        run: |
          echo "Scanning image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"
          trivy image \
            --exit-code 0 \
            --format table \
            --pkg-types os,library \
            --ignore-unfixed \
            --severity CRITICAL,HIGH \
            -o trivy-report.txt \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          
          echo "==================== TRIVY SCAN COMPLETED ===================="
          cat trivy-report.txt

      # 5️⃣ Upload the Trivy report as artifact
      - name: Upload Trivy text report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-text-report
          path: trivy-report.txt
      - name: EKS with manifestfile 
           uses: actions-hub/kubectl@master
           env:
            KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
         - uses: tale/kubectl-action@v1
         - run: | 
             kubectl apply -f .
             kubectl get po 
